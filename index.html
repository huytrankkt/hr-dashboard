<!DOCTYPE html>
<html lang="vi" data-theme="dark" data-font="md">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HR Task Dashboard — SOL E&C</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════
   DESIGN SYSTEM
   Aesthetic: Refined dark, editorial precision
   Font: DM Sans (display) + JetBrains Mono (data)
   ══════════════════════════════════════ */
:root {
  --font: 'DM Sans', sans-serif;
  --mono: 'JetBrains Mono', monospace;
  --r-sm: 6px; --r-md: 10px; --r-lg: 14px;
  --sidebar-w: 230px;
  --detail-w: 380px;
}

/* ══ DARK THEME (default) ══ */
[data-theme="dark"] {
  --bg-0: #04070d; --bg-1: #0a0f1a; --bg-2: #101828; --bg-3: #182036;
  --bg-hover: #1a2540; --bg-glass: rgba(16,24,40,0.92);
  --border-0: #1c2640; --border-1: #253354; --border-focus: #528bff;
  --text-0: #f0f2f8; --text-1: #a4b0c8; --text-2: #5c6b88; --text-3: #3a4662;
  --blue: #528bff;   --blue-d: rgba(82,139,255,0.12);
  --green: #34d399;  --green-d: rgba(52,211,153,0.10);
  --amber: #fbbf24;  --amber-d: rgba(251,191,36,0.10);
  --red: #f87171;    --red-d: rgba(248,113,113,0.10);
  --purple: #a78bfa; --purple-d: rgba(167,139,250,0.10);
  --cyan: #22d3ee;   --cyan-d: rgba(34,211,238,0.10);
  --pink: #f472b6;   --pink-d: rgba(244,114,182,0.10);
  --lime: #a3e635;   --lime-d: rgba(163,230,53,0.10);
  --scrollbar-thumb: #3a4662;
}

/* ══ LIGHT THEME ══ */
[data-theme="light"] {
  --bg-0: #f0f2f6; --bg-1: #e8ebf0; --bg-2: #ffffff; --bg-3: #edf0f4;
  --bg-hover: #e2e6ed; --bg-glass: rgba(232,235,240,0.95);
  --border-0: #c8ced8; --border-1: #b0b8c6; --border-focus: #2b5cb5;
  --text-0: #111827; --text-1: #374151; --text-2: #6b7280; --text-3: #9ca3af;
  --blue: #2563eb;   --blue-d: rgba(37,99,235,0.12);
  --green: #15803d;  --green-d: rgba(21,128,61,0.10);
  --amber: #b45309;  --amber-d: rgba(180,83,9,0.10);
  --red: #b91c1c;    --red-d: rgba(185,28,28,0.10);
  --purple: #6d28d9; --purple-d: rgba(109,40,217,0.10);
  --cyan: #0e7490;   --cyan-d: rgba(14,116,144,0.10);
  --pink: #be185d;   --pink-d: rgba(190,24,93,0.10);
  --lime: #4d7c0f;   --lime-d: rgba(77,124,15,0.10);
  --scrollbar-thumb: #b0b8c6;
}

/* ══ FONT SIZE SCALING ══ */
[data-font="sm"] { font-size: 13px; }
[data-font="md"] { font-size: 15px; }
[data-font="lg"] { font-size: 17px; }
[data-font="xl"] { font-size: 19px; }

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 15px; }
body {
  font-family: var(--font); background: var(--bg-0); color: var(--text-0);
  height: 100vh; overflow: hidden;
  display: flex; transition: background 0.3s, color 0.3s;
}
::selection { background: var(--blue); color: #fff; }
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 3px; }
input, select, textarea, button { font-family: var(--font); color: var(--text-0); }

/* ══════════════════════════════════════
   SIDEBAR
   ══════════════════════════════════════ */
.sidebar {
  width: var(--sidebar-w); min-width: var(--sidebar-w);
  background: var(--bg-1); border-right: 1px solid var(--border-0);
  display: flex; flex-direction: column; height: 100vh;
  padding: 16px 12px; transition: background 0.3s, border-color 0.3s;
}
.sidebar-logo { display: flex; align-items: center; gap: 10px; padding: 4px 8px; margin-bottom: 24px; }
.sidebar-logo .icon {
  width: 34px; height: 34px; border-radius: 8px;
  background: linear-gradient(135deg, var(--blue), var(--purple));
  display: grid; place-items: center; font-size: 16px;
}
.sidebar-logo .name { font-size: 0.92rem; font-weight: 700; letter-spacing: -0.02em; }
.sidebar-logo .sub { font-size: 0.68rem; color: var(--text-2); margin-top: 1px; }

.nav-section { margin-bottom: 20px; }
.nav-label { font-size: 0.65rem; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.08em; padding: 0 10px; margin-bottom: 6px; font-weight: 600; }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: var(--r-sm); cursor: pointer;
  font-size: 0.82rem; color: var(--text-1); font-weight: 500;
  transition: all 0.12s; position: relative;
}
.nav-item:hover { background: var(--bg-3); color: var(--text-0); }
.nav-item.active { background: var(--blue-d); color: var(--blue); }
.nav-item .nav-icon { width: 18px; text-align: center; font-size: 0.9rem; flex-shrink: 0; }
.nav-item .badge {
  margin-left: auto; font-family: var(--mono); font-size: 0.65rem;
  padding: 1px 7px; border-radius: 10px; font-weight: 600;
}
.badge-red { background: var(--red-d); color: var(--red); }
.badge-blue { background: var(--blue-d); color: var(--blue); }

.sidebar-filters { flex: 1; overflow-y: auto; }
.filter-section { margin-bottom: 14px; }
.filter-title { font-size: 0.68rem; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.06em; padding: 0 10px; margin-bottom: 4px; font-weight: 600; }
.filter-chip {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 10px; border-radius: var(--r-sm); cursor: pointer;
  font-size: 0.78rem; color: var(--text-2); transition: all 0.1s;
}
.filter-chip:hover { background: var(--bg-3); color: var(--text-1); }
.filter-chip.active { color: var(--text-0); background: var(--bg-3); }
.filter-chip .dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
.filter-chip .count { margin-left: auto; font-family: var(--mono); font-size: 0.65rem; color: var(--text-3); }

.sidebar-user {
  margin-top: auto; padding: 10px; border-top: 1px solid var(--border-0);
  display: flex; align-items: center; gap: 10px;
}
.user-avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--purple-d); display: grid; place-items: center;
  font-size: 0.7rem; font-weight: 700; color: var(--purple);
}
.user-name { font-size: 0.78rem; font-weight: 600; }
.user-role { font-size: 0.65rem; color: var(--text-2); }
.user-select {
  background: transparent; border: none; color: var(--text-1);
  font-size: 0.78rem; font-family: var(--font); cursor: pointer;
  padding: 2px 0; width: 100%;
}
.user-select option { background: var(--bg-2); }

/* ══════════════════════════════════════
   MAIN CONTENT
   ══════════════════════════════════════ */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

/* Top bar */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 24px; border-bottom: 1px solid var(--border-0);
  background: var(--bg-1); flex-shrink: 0;
}
.topbar-left { display: flex; align-items: center; gap: 16px; }
.topbar-title { font-size: 1.15rem; font-weight: 700; letter-spacing: -0.02em; }
.topbar-sub { font-size: 0.72rem; color: var(--text-2); font-family: var(--mono); }
.topbar-right { display: flex; align-items: center; gap: 10px; }
.sync-pill {
  font-family: var(--mono); font-size: 0.65rem; color: var(--green);
  background: var(--green-d); padding: 4px 12px; border-radius: 12px;
  display: flex; align-items: center; gap: 6px;
}
.sync-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.3} }
.btn-icon {
  width: 32px; height: 32px; border-radius: var(--r-sm);
  background: var(--bg-3); border: 1px solid var(--border-0);
  color: var(--text-1); cursor: pointer; display: grid; place-items: center;
  font-size: 0.85rem; transition: all 0.12s;
}
.btn-icon:hover { border-color: var(--blue); color: var(--blue); }

/* Content area */
.content-area {
  flex: 1; display: flex; overflow: hidden;
}
.content-main {
  flex: 1; overflow-y: auto; padding: 20px 24px; min-width: 0;
}

/* ══════════════════════════════════════
   ALERTS BAR
   ══════════════════════════════════════ */
.alerts-bar {
  display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto;
  padding-bottom: 4px;
}
.alert-card {
  flex-shrink: 0; padding: 10px 16px; border-radius: var(--r-md);
  border: 1px solid; display: flex; align-items: center; gap: 10px;
  font-size: 0.78rem; font-weight: 500; cursor: pointer;
  transition: transform 0.12s;
}
.alert-card:hover { transform: translateY(-1px); }
.alert-card.danger { background: var(--red-d); border-color: rgba(248,113,113,0.2); color: var(--red); }
.alert-card.warning { background: var(--amber-d); border-color: rgba(251,191,36,0.2); color: var(--amber); }
.alert-card.info { background: var(--blue-d); border-color: rgba(82,139,255,0.2); color: var(--blue); }
.alert-num { font-family: var(--mono); font-size: 1.2rem; font-weight: 700; }

/* ══════════════════════════════════════
   KPI ROW
   ══════════════════════════════════════ */
.kpi-row { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
.kpi-mini {
  flex: 1; min-width: 120px; padding: 12px 16px;
  background: var(--bg-2); border: 1px solid var(--border-0);
  border-radius: var(--r-md);
}
.kpi-mini-label { font-size: 0.68rem; color: var(--text-2); font-weight: 500; }
.kpi-mini-val { font-size: 1.4rem; font-weight: 800; margin-top: 4px; letter-spacing: -0.03em; }
.kpi-mini-sub { font-size: 0.62rem; color: var(--text-3); font-family: var(--mono); margin-top: 2px; }

/* ══════════════════════════════════════
   TASK LIST
   ══════════════════════════════════════ */
.task-list-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 10px;
}
.task-list-title { font-size: 0.85rem; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.task-count-badge { font-family: var(--mono); font-size: 0.62rem; background: var(--blue-d); color: var(--blue); padding: 2px 8px; border-radius: 8px; }
.btn-add {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 14px; border-radius: var(--r-sm);
  background: var(--blue); color: #fff; border: none;
  font-size: 0.78rem; font-weight: 600; cursor: pointer;
  transition: all 0.12s;
}
.btn-add:hover { opacity: 0.85; }

.search-bar {
  margin-bottom: 12px;
}
.search-bar input {
  width: 100%; padding: 8px 14px 8px 34px;
  background: var(--bg-2); border: 1px solid var(--border-0);
  border-radius: var(--r-sm); color: var(--text-0); font-size: 0.82rem;
  transition: border-color 0.15s;
}
.search-bar input:focus { outline: none; border-color: var(--blue); }
.search-bar { position: relative; }
.search-bar::before { content: '🔍'; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 0.75rem; }

/* Task rows */
.task-table { width: 100%; }
.task-table-head {
  display: grid;
  grid-template-columns: minmax(200px, 2fr) 100px 140px 90px 80px 90px 60px;
  gap: 8px; padding: 8px 12px;
  font-size: 0.65rem; color: var(--text-3); text-transform: uppercase;
  letter-spacing: 0.06em; font-weight: 600;
  border-bottom: 1px solid var(--border-0);
}
.task-row {
  display: grid;
  grid-template-columns: minmax(200px, 2fr) 100px 140px 90px 80px 90px 60px;
  gap: 8px; padding: 10px 12px;
  border-bottom: 1px solid rgba(28,38,64,0.5);
  cursor: pointer; transition: background 0.1s;
  align-items: center; font-size: 0.82rem;
}
.task-row:hover { background: var(--bg-hover); }
.task-row.selected { background: var(--blue-d); border-left: 2px solid var(--blue); }
.task-row.overdue { border-left: 2px solid var(--red); }

.task-title-cell { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.task-title { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.task-labels { display: flex; gap: 3px; flex-wrap: wrap; }

.label-tag {
  font-size: 0.6rem; font-weight: 700; padding: 1px 6px;
  border-radius: 3px; white-space: nowrap; letter-spacing: 0.02em;
}
.label-hoso { background: var(--red-d); color: var(--red); }
.label-daotao { background: var(--amber-d); color: var(--amber); }
.label-cnb { background: var(--green-d); color: var(--green); }
.label-qhld { background: var(--purple-d); color: var(--purple); }
.label-hethong { background: var(--cyan-d); color: var(--cyan); }
.label-phanmem { background: var(--pink-d); color: var(--pink); }
.label-khac { background: var(--lime-d); color: var(--lime); }

.status-pill {
  font-size: 0.68rem; font-weight: 600; padding: 3px 8px;
  border-radius: 12px; display: inline-flex; align-items: center; gap: 4px;
  white-space: nowrap; cursor: pointer;
}
.status-pill::before { content: ''; width: 5px; height: 5px; border-radius: 50%; }
.st-notstarted { background: rgba(90,107,136,0.15); color: var(--text-2); }
.st-notstarted::before { background: var(--text-2); }
.st-inprogress { background: var(--blue-d); color: var(--blue); }
.st-inprogress::before { background: var(--blue); }
.st-completed { background: var(--green-d); color: var(--green); }
.st-completed::before { background: var(--green); }

.priority-tag { font-size: 0.68rem; font-weight: 600; padding: 2px 7px; border-radius: 3px; }
.pr-urgent { background: var(--red-d); color: var(--red); }
.pr-important { background: var(--amber-d); color: var(--amber); }
.pr-medium { background: var(--blue-d); color: var(--blue); }
.pr-low { background: rgba(90,107,136,0.1); color: var(--text-3); }

.due-cell { font-family: var(--mono); font-size: 0.72rem; }
.due-overdue { color: var(--red); font-weight: 600; }
.due-soon { color: var(--amber); }
.due-ok { color: var(--text-2); }
.due-done { color: var(--green); opacity: 0.7; }
.due-none { color: var(--text-3); }

.cl-cell { font-family: var(--mono); font-size: 0.7rem; color: var(--text-2); }
.cl-done { color: var(--green); }

/* Pagination */
.pagination { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; margin-top: 8px; }
.pagination-info { font-size: 0.72rem; color: var(--text-3); font-family: var(--mono); }
.pg-btns { display: flex; gap: 3px; }
.pg-btns button {
  font-family: var(--mono); font-size: 0.72rem;
  background: var(--bg-2); color: var(--text-2);
  border: 1px solid var(--border-0); border-radius: 4px;
  padding: 4px 10px; cursor: pointer; transition: all 0.1s;
}
.pg-btns button:hover:not(:disabled) { border-color: var(--blue); color: var(--blue); }
.pg-btns button.active { background: var(--blue); color: #fff; border-color: var(--blue); }
.pg-btns button:disabled { opacity: 0.2; cursor: not-allowed; }

/* ══════════════════════════════════════
   DETAIL PANEL (right side)
   ══════════════════════════════════════ */
.detail-panel {
  width: 0; min-width: 0; overflow: hidden;
  border-left: 1px solid var(--border-0);
  background: var(--bg-1);
  transition: width 0.25s ease, min-width 0.25s ease;
  display: flex; flex-direction: column;
}
.detail-panel.open { width: var(--detail-w); min-width: var(--detail-w); }
.detail-scroll { flex: 1; overflow-y: auto; padding: 20px; }
.detail-close {
  position: absolute; top: 12px; right: 12px;
  width: 28px; height: 28px; border-radius: var(--r-sm);
  background: var(--bg-3); border: none; color: var(--text-1);
  cursor: pointer; font-size: 0.85rem; display: grid; place-items: center;
}
.detail-close:hover { background: var(--red-d); color: var(--red); }
.detail-header { position: relative; margin-bottom: 20px; }
.detail-title { font-size: 1.1rem; font-weight: 700; padding-right: 36px; line-height: 1.4; }
.detail-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }

.detail-field { margin-bottom: 16px; }
.detail-field-label { font-size: 0.68rem; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; margin-bottom: 6px; }
.detail-field-value { font-size: 0.85rem; color: var(--text-1); }
.detail-field-value select, .detail-field-value input {
  background: var(--bg-2); border: 1px solid var(--border-0);
  border-radius: var(--r-sm); color: var(--text-0); padding: 6px 10px;
  font-size: 0.82rem; width: 100%;
}
.detail-field-value select:focus, .detail-field-value input:focus { outline: none; border-color: var(--blue); }

/* Description */
.desc-box {
  background: var(--bg-2); border: 1px solid var(--border-0);
  border-radius: var(--r-sm); padding: 10px 12px;
  font-size: 0.82rem; color: var(--text-1); line-height: 1.6;
  min-height: 60px; white-space: pre-wrap;
}
.desc-box.empty { color: var(--text-3); font-style: italic; }

/* Checklist */
.checklist { list-style: none; }
.checklist-item {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 6px 0; border-bottom: 1px solid rgba(28,38,64,0.3);
  font-size: 0.82rem; color: var(--text-1);
}
.checklist-item input[type="checkbox"] {
  margin-top: 3px; accent-color: var(--blue); cursor: pointer;
  width: 15px; height: 15px; flex-shrink: 0;
}
.checklist-item.done { color: var(--text-3); text-decoration: line-through; }
.checklist-progress {
  display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
}
.cl-bar-track { flex: 1; height: 4px; background: var(--bg-3); border-radius: 2px; overflow: hidden; }
.cl-bar-fill { height: 100%; background: var(--blue); border-radius: 2px; transition: width 0.3s; }
.cl-bar-label { font-family: var(--mono); font-size: 0.68rem; color: var(--text-2); min-width: 40px; text-align: right; }

/* ══════════════════════════════════════
   ANALYTICS VIEW
   ══════════════════════════════════════ */
.charts-row { display: grid; grid-template-columns: 1fr 1.3fr; gap: 14px; margin-bottom: 20px; }
.chart-card { background: var(--bg-2); border: 1px solid var(--border-0); border-radius: var(--r-lg); padding: 20px; }
.chart-title { font-size: 0.72rem; font-weight: 600; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 16px; }
.donut-wrap { display: flex; align-items: center; gap: 24px; justify-content: center; }
.donut-svg { width: 150px; height: 150px; flex-shrink: 0; }
.donut-legend { display: flex; flex-direction: column; gap: 8px; }
.legend-row { display: flex; align-items: center; gap: 8px; font-size: 0.78rem; }
.legend-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
.legend-val { margin-left: auto; font-family: var(--mono); font-weight: 600; }
.bar-chart { display: flex; flex-direction: column; gap: 8px; }
.bar-row { display: flex; align-items: center; gap: 10px; }
.bar-label { font-size: 0.72rem; color: var(--text-2); min-width: 75px; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-track { flex: 1; height: 20px; background: var(--bg-3); border-radius: 3px; display: flex; overflow: hidden; gap: 1px; }
.bar-fill { height: 100%; display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 0.6rem; font-weight: 600; color: #fff; min-width: 16px; }
.bf-red { background: var(--red); } .bf-amber { background: var(--amber); color: #1a1a1a; } .bf-green { background: var(--green); color: #1a1a1a; }
.bar-legend { display: flex; gap: 12px; margin-top: 8px; font-size: 0.65rem; color: var(--text-3); }
.bar-legend span { display: flex; align-items: center; gap: 4px; }
.bar-legend .ldot { width: 8px; height: 8px; border-radius: 2px; }

/* Calendar view placeholder */
.calendar-grid {
  display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px;
}
.cal-header { font-size: 0.68rem; color: var(--text-3); text-align: center; padding: 8px 0; font-weight: 600; }
.cal-cell {
  min-height: 80px; padding: 6px 8px; background: var(--bg-2);
  border: 1px solid var(--border-0); border-radius: var(--r-sm);
  font-size: 0.72rem; position: relative;
}
.cal-cell.today { border-color: var(--blue); }
.cal-day { font-family: var(--mono); font-size: 0.68rem; color: var(--text-2); margin-bottom: 4px; }
.cal-task {
  font-size: 0.65rem; padding: 2px 4px; border-radius: 2px;
  margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  cursor: pointer;
}

async function loadData() {
  // Load tasks + history in parallel
  // Fetch with timeout helper
  const fetchWithTimeout = (url, ms) => {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), ms);
    return fetch(url, { signal: ctrl.signal }).finally(() => clearTimeout(timer));
  };

  const [tasksData, historyData] = await Promise.allSettled([
    (async () => {
      if (!CFG.JSON_URL) return null;
      const r = await fetch(CFG.JSON_URL);
      if (!r.ok) throw new Error(r.status);
      return r.json();
    })(),
    (async () => {
      if (!CFG.HISTORY_URL) return null;
      const r = await fetchWithTimeout(CFG.HISTORY_URL, 8000); // 8s timeout — don't block dashboard
      if (!r.ok) throw new Error(r.status);
      return r.json();
    })()
  ]);

  // Process tasks
  if (tasksData.status === 'fulfilled' && tasksData.value) {
    const d = tasksData.value;
    ALL = Array.isArray(d) ? d : (d.tasks || d.value || []);
  } else {
    console.warn('Tasks fetch fail:', tasksData.reason || 'no URL');
    ALL = getMockData();
  }

  // Process history
  if (historyData.status === 'fulfilled' && historyData.value) {
    const h = historyData.value;
    HISTORY_ALL = Array.isArray(h) ? h : (h.value || []);
  } else {
    HISTORY_ALL = [];
  }

  // Normalize task fields
  ALL.forEach(t => {
    t.Status = t.Status?.Value || t.Status || 'Not Started';
    t.Priority = t.Priority?.Value || t.Priority || 'Low';
    t.ChecklistTotal = t.ChecklistTotal || 0;
    t.ChecklistDone = t.ChecklistDone || 0;
    t.Labels = t.Labels || '';
    t.Description = t.Description || '';
    t.ChecklistItems = t.ChecklistItems || '';
    // Parse checklist JSON if string
    if (typeof t.ChecklistItems === 'string' && (t.ChecklistItems.startsWith('[') || t.ChecklistItems.startsWith('{'))) {
      try {
        const parsed = JSON.parse(t.ChecklistItems);
        if (Array.isArray(parsed)) {
          t._checklist = parsed.map(item => ({
            isChecked: item.value?.isChecked ?? item.isChecked ?? false,
            title: item.value?.title ?? item.title ?? ''
          }));
        } else if (typeof parsed === 'object') {
          t._checklist = Object.values(parsed).map(item => ({
            isChecked: item.isChecked ?? false,
            title: item.title ?? ''
          }));
        }
      } catch(e) { t._checklist = null; }
    } else { t._checklist = null; }
  });

  // Map history records to tasks
  // History records can be matched by TaskID (Planner ID) or TaskTitle (fallback)
  if (HISTORY_ALL.length > 0) {
    // Build lookup: TaskID → array of changes
    const historyByID = {};
    const historyByTitle = {};
    HISTORY_ALL.forEach(h => {
      // Normalize field: SharePoint Choice columns return {Value:"DueDate"} object instead of string
      const rawField = h.field || h.Field || '';
      const fieldStr = typeof rawField === 'object' ? (rawField.Value || rawField.value || '') : rawField;
      const fieldMap = {
        'DueDate': 'deadline', 'deadline': 'deadline',
        'Status': 'status', 'status': 'status',
        'Priority': 'priority', 'priority': 'priority',
        'AssignedTo': 'assignee', 'assignee': 'assignee'
      };
      const normalized = {
        field: fieldMap[fieldStr] || fieldStr.toLowerCase(),
        old: h.old || h.OldValue || h.oldValue || '',
        new: h.new || h.NewValue || h.newValue || '',
        date: h.date || h.ChangedDate || h.changedDate || ''
      };

      // Skip records with no TaskID AND no date (broken records)
      const tid = h.TaskID || h.taskId || h.taskID || '';
      const ttl = h.TaskTitle || h.taskTitle || '';
      if (!tid && !ttl) return; // skip unmatchable records

      if (tid) {
        if (!historyByID[tid]) historyByID[tid] = [];
        historyByID[tid].push(normalized);
      }
      if (ttl) {
        if (!historyByTitle[ttl]) historyByTitle[ttl] = [];
        historyByTitle[ttl].push(normalized);
      }
    });

    // Attach to tasks — match by TaskID first, then by Title
    ALL.forEach(t => {
      const tid = t.TaskID || t.Id || t.id || '';
      if (tid && historyByID[tid]) {
        t._history = historyByID[tid];
      } else if (t.Title && historyByTitle[t.Title]) {
        t._history = historyByTitle[t.Title];
      }
      // _history remains undefined if no matches → getMockHistory fallback
    });

    console.log(`TaskHistory loaded: ${HISTORY_ALL.length} records mapped to tasks`);
  } else if (!CFG.HISTORY_URL) {
    console.log('TaskHistory: no HISTORY_URL configured, using mock data');
  }

  document.getElementById('syncTime').textContent = new Date().toLocaleString('vi-VN',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'});
  document.getElementById('todayDate').textContent = new Date().toLocaleDateString('vi-VN',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'});
  document.getElementById('loadingWrap').style.display = 'none';
}

/* ══════════════════════════════════════
   HELPERS
   ══════════════════════════════════════ */
const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
function dueCat(due, st) {
  if (st === 'Completed') return 'done';
  if (!due) return 'none';
  const d = Math.ceil((new Date(due) - today()) / 86400000);
  return d < 0 ? 'overdue' : d <= 3 ? 'urgent' : d <= 7 ? 'soon' : 'ok';
}
function fmtDate(d) { return d ? new Date(d).toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit'}) : '—'; }
function daysLeft(d) {
  if (!d) return '';
  const diff = Math.ceil((new Date(d) - today()) / 86400000);
  return diff < 0 ? `${-diff}d trễ` : diff === 0 ? 'Hôm nay' : `${diff}d`;
}
function labelHTML(labels) {
  if (!labels) return '';
  return labels.split(';').map(l=>l.trim()).filter(Boolean).map(l => {
    const c = CFG.LABELS[l]; return c ? `<span class="label-tag ${c.css}">${l}</span>` : `<span class="label-tag label-khac">${l}</span>`;
  }).join('');
}
function statusClass(s) { return s==='Completed'?'st-completed':s==='In Progress'?'st-inprogress':'st-notstarted'; }
function statusLabel(s) { return s==='Completed'?'Hoàn thành':s==='In Progress'?'Đang thực hiện':'Chưa bắt đầu'; }
function prClass(p) { return `pr-${(p||'low').toLowerCase()}`; }
function prLabel(p) { return {Urgent:'Khẩn cấp',Important:'Quan trọng',Medium:'Trung bình',Low:'Thấp'}[p]||p; }
function memberColor(name) { return CFG.MEMBERS.find(m=>m.name===name)?.color || 'var(--text-2)'; }
function memberInitials(name) { return CFG.MEMBERS.find(m=>m.name===name)?.initials || name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase(); }

/* ══════════════════════════════════════
   FILTER + SORT
   ══════════════════════════════════════ */
function applyFilters() {
  filtered = ALL.filter(t => {
    // My Tasks view: filter by current user
    if (currentView === 'mytasks' && currentUser !== 'all' && !(t.AssignedTo||'').includes(currentUser)) return false;
    if (filterLabel && !(t.Labels||'').includes(filterLabel)) return false;
    if (filterStatus && t.Status !== filterStatus) return false;
    if (filterBucket && t.BucketName !== filterBucket) return false;
    if (searchQ && !(t.Title||'').toLowerCase().includes(searchQ) && !(t.AssignedTo||'').toLowerCase().includes(searchQ)) return false;
    return true;
  });
  filtered.sort((a,b) => {
    let va=a[sortCol]??'',vb=b[sortCol]??'';
    if (sortCol==='DueDate') { va=new Date(va||'2099-12-31'); vb=new Date(vb||'2099-12-31'); }
    if (sortCol==='Priority') { const o={Urgent:0,Important:1,Medium:2,Low:3}; va=o[va]??9; vb=o[vb]??9; }
    return sortDir==='asc'?(va<vb?-1:va>vb?1:0):(va>vb?-1:va<vb?1:0);
  });
  page = 1;
}

/* ══════════════════════════════════════
   SIDEBAR
   ══════════════════════════════════════ */
function buildSidebar() {
  // User select
  const sel = document.getElementById('userSelect');
  sel.innerHTML = CFG.MEMBERS.map(m => `<option value="${m.id}" ${m.id===currentUser?'selected':''}>${m.name}</option>`).join('');
  sel.onchange = () => { currentUser = sel.value; updateUserAvatar(); render(); };
  updateUserAvatar();

  // Nav items
  document.querySelectorAll('.nav-item[data-view]').forEach(el => {
    el.onclick = () => {
      document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
      el.classList.add('active');
      currentView = el.dataset.view;
      closeDetail();
      render();
    };
  });

  buildSidebarFilters();
}

function updateUserAvatar() {
  const m = CFG.MEMBERS.find(x=>x.id===currentUser) || CFG.MEMBERS[0];
  const av = document.getElementById('userAvatar');
  av.textContent = m.initials;
  av.style.background = m.color.replace(')', ',0.15)').replace('var(','rgba(');
  av.style.color = m.color;
}

function buildSidebarFilters() {
  const labels = Object.keys(CFG.LABELS);
  const buckets = [...new Set(ALL.map(t=>t.BucketName).filter(Boolean))].sort();
  const statuses = ['Not Started','In Progress','Completed'];

  let html = '';
  // Labels
  html += `<div class="filter-section"><div class="filter-title">Nhãn</div>`;
  html += `<div class="filter-chip ${!filterLabel?'active':''}" onclick="filterLabel='';render()"><span class="dot" style="background:var(--text-2)"></span> Tất cả</div>`;
  labels.forEach(l => {
    const c = CFG.LABELS[l];
    const count = ALL.filter(t=>(t.Labels||'').includes(l)).length;
    html += `<div class="filter-chip ${filterLabel===l?'active':''}" onclick="filterLabel='${l}';render()"><span class="dot" style="background:${c.color}"></span> ${l} <span class="count">${count}</span></div>`;
  });
  html += '</div>';

  // Status
  html += `<div class="filter-section"><div class="filter-title">Trạng thái</div>`;
  html += `<div class="filter-chip ${!filterStatus?'active':''}" onclick="filterStatus='';render()">Tất cả</div>`;
  statuses.forEach(s => {
    const count = ALL.filter(t=>t.Status===s).length;
    html += `<div class="filter-chip ${filterStatus===s?'active':''}" onclick="filterStatus='${s}';render()">${statusLabel(s)} <span class="count">${count}</span></div>`;
  });
  html += '</div>';

  // Buckets
  html += `<div class="filter-section"><div class="filter-title">Tuần</div>`;
  html += `<div class="filter-chip ${!filterBucket?'active':''}" onclick="filterBucket='';render()">Tất cả</div>`;
  buckets.forEach(b => {
    const short = b.length > 28 ? b.slice(0,26)+'…' : b;
    html += `<div class="filter-chip ${filterBucket===b?'active':''}" onclick="filterBucket='${b.replace(/'/g,"\\'")}';render()" title="${b}">${short}</div>`;
  });
  html += '</div>';

  document.getElementById('sidebarFilters').innerHTML = html;
}

/* ══════════════════════════════════════
   RENDER VIEWS
   ══════════════════════════════════════ */
function render() {
  applyFilters();
  const c = document.getElementById('contentMain');
  const titles = { mytasks:'My Tasks', team:'Team View', analytics:'Analytics', performance:'Performance Report', calendar:'Calendar' };
  document.getElementById('viewTitle').textContent = titles[currentView] || 'Dashboard';

  // Update my tasks count
  const myCount = ALL.filter(t=>(t.AssignedTo||'').includes(currentUser) && t.Status!=='Completed').length;
  document.getElementById('myTasksCount').textContent = myCount;

  // Build sidebar filters
  buildSidebarFilters();

  if (currentView === 'mytasks' || currentView === 'team') renderTaskView(c);
  else if (currentView === 'analytics') renderAnalytics(c);
  else if (currentView === 'performance') renderPerformance(c);
  else if (currentView === 'calendar') renderCalendar(c);
}

/* ══════════════════════════════════════
   TASK VIEW (My Tasks + Team)
   ══════════════════════════════════════ */
function renderTaskView(container) {
  const isTeam = currentView === 'team';
  const todayD = today();
  const overdue = filtered.filter(t=>t.Status!=='Completed'&&t.DueDate&&new Date(t.DueDate)<todayD).length;
  const urgent = filtered.filter(t=>{if(t.Status==='Completed'||!t.DueDate)return false;const d=Math.ceil((new Date(t.DueDate)-todayD)/86400000);return d>=0&&d<=3}).length;
  const ip = filtered.filter(t=>t.Status==='In Progress').length;
  const done = filtered.filter(t=>t.Status==='Completed').length;

  let html = '<div class="fade-in">';

  // Alerts
  if (overdue > 0 || urgent > 0) {
    html += '<div class="alerts-bar">';
    if (overdue) html += `<div class="alert-card danger" onclick="filterStatus='';searchQ='';filterLabel='';render()"><span class="alert-num">${overdue}</span> task quá hạn</div>`;
    if (urgent) html += `<div class="alert-card warning"><span class="alert-num">${urgent}</span> task sắp trễ (≤3 ngày)</div>`;
    html += '</div>';
  }

  // KPI row
  html += `<div class="kpi-row">
    <div class="kpi-mini"><div class="kpi-mini-label">Tổng</div><div class="kpi-mini-val" style="color:var(--blue)">${filtered.length}</div></div>
    <div class="kpi-mini"><div class="kpi-mini-label">Đang thực hiện</div><div class="kpi-mini-val" style="color:var(--amber)">${ip}</div></div>
    <div class="kpi-mini"><div class="kpi-mini-label">Hoàn thành</div><div class="kpi-mini-val" style="color:var(--green)">${done}</div></div>
    <div class="kpi-mini"><div class="kpi-mini-label">Quá hạn</div><div class="kpi-mini-val" style="color:var(--red)">${overdue}</div></div>
    <div class="kpi-mini"><div class="kpi-mini-label">Tỷ lệ</div><div class="kpi-mini-val" style="color:var(--purple)">${filtered.length?Math.round(done/filtered.length*100):0}%</div></div>
  </div>`;

  // Search + header
  html += `<div class="task-list-header">
    <div class="task-list-title">Danh sách task <span class="task-count-badge">${filtered.length}</span></div>
  </div>`;
  html += `<div class="search-bar"><input placeholder="Tìm task, người, nhãn..." value="${searchQ}" oninput="searchQ=this.value.toLowerCase();render()"></div>`;

  if (isTeam) {
    const members = [...new Set(filtered.flatMap(t=>(t.AssignedTo||'').split(',').map(s=>s.trim())).filter(Boolean))].sort();
    members.forEach(member => {
      const mTasks = filtered.filter(t=>(t.AssignedTo||'').includes(member));
      const mOverdue = mTasks.filter(t=>t.Status!=='Completed'&&t.DueDate&&new Date(t.DueDate)<todayD).length;
      const mDone = mTasks.filter(t=>t.Status==='Completed').length;
      const mIP = mTasks.filter(t=>t.Status==='In Progress').length;
      const mColor = memberColor(member);
      html += `<div class="team-member-section" style="border-left:3px solid ${mColor}">
        <div class="team-member-header">
          <div class="team-avatar" style="background:${mColor.replace(')',',0.15)').replace('var(','rgba(')};color:${mColor};border-color:${mColor}">${memberInitials(member)}</div>
          <div>
            <div class="team-member-name">${member}</div>
            <div style="font-size:0.72rem;color:var(--text-2);margin-top:1px">${mTasks.length} task</div>
          </div>
          <div class="team-member-stats">
            <div class="team-stat" style="color:var(--blue)"><span style="font-weight:700">${mIP}</span> đang làm</div>
            <div class="team-stat" style="color:var(--green)"><span style="font-weight:700">${mDone}</span> xong</div>
            ${mOverdue?`<div class="team-stat" style="color:var(--red)"><span style="font-weight:700">${mOverdue}</span> trễ</div>`:''}
          </div>
        </div>`;
      html += renderTaskRows(mTasks);
      html += '</div>';
    });
  } else {
    // Table header
    html += `<div class="task-table-head">
      <div style="cursor:pointer" onclick="toggleSort('Title')">Task ${sortIcon('Title')}</div>
      <div>Nhãn</div>
      <div style="cursor:pointer" onclick="toggleSort('AssignedTo')">Phụ trách ${sortIcon('AssignedTo')}</div>
      <div style="cursor:pointer" onclick="toggleSort('Status')">Trạng thái ${sortIcon('Status')}</div>
      <div style="cursor:pointer" onclick="toggleSort('Priority')">Ưu tiên ${sortIcon('Priority')}</div>
      <div style="cursor:pointer" onclick="toggleSort('DueDate')">Deadline ${sortIcon('DueDate')}</div>
      <div>CL</div>
    </div>`;
    // Paginated rows
    const start = (page-1)*CFG.PER_PAGE;
    const pageData = filtered.slice(start, start+CFG.PER_PAGE);
    html += renderTaskRows(pageData);
    html += renderPagination();
  }

  html += '</div>';
  container.innerHTML = html;
}

function renderTaskRows(tasks) {
  return tasks.map((t,i) => {
    const cat = dueCat(t.DueDate, t.Status);
    const dueCls = cat==='overdue'?'due-overdue':cat==='urgent'?'due-soon':cat==='soon'?'due-soon':cat==='done'?'due-done':cat==='none'?'due-none':'due-ok';
    const isSelected = selectedTask === t;
    const isOverdue = cat === 'overdue';
    const cl = t.ChecklistTotal > 0;
    return `<div class="task-row ${isSelected?'selected':''} ${isOverdue?'overdue':''}" onclick="openDetail(${ALL.indexOf(t)})">
      <div class="task-title-cell"><div class="task-title">${t.Title}</div><div class="task-labels">${labelHTML(t.Labels)}</div></div>
      <div>${labelHTML(t.Labels)?'':'<span style="color:var(--text-3);font-size:0.7rem">—</span>'}</div>
      <div style="font-size:0.78rem;color:var(--text-1)">${(t.AssignedTo||'').split(',').map(s=>s.trim().split(' ').slice(-1)[0]).join(', ')}</div>
      <div><span class="status-pill ${statusClass(t.Status)}">${statusLabel(t.Status)}</span></div>
      <div><span class="priority-tag ${prClass(t.Priority)}">${prLabel(t.Priority)}</span></div>
      <div class="due-cell ${dueCls}">${fmtDate(t.DueDate)}<br><span style="font-size:0.62rem">${daysLeft(t.DueDate)}</span></div>
      <div class="cl-cell ${cl&&t.ChecklistDone===t.ChecklistTotal?'cl-done':''}">${cl?`${t.ChecklistDone}/${t.ChecklistTotal}`:'—'}</div>
    </div>`;
  }).join('');
}

function sortIcon(col) { return sortCol===col ? (sortDir==='asc'?'↑':'↓') : ''; }
function toggleSort(col) { if(sortCol===col) sortDir=sortDir==='asc'?'desc':'asc'; else {sortCol=col;sortDir='asc';} render(); }

function renderPagination() {
  const tp = Math.ceil(filtered.length/CFG.PER_PAGE)||1;
  const s = (page-1)*CFG.PER_PAGE+1;
  const e = Math.min(page*CFG.PER_PAGE, filtered.length);
  let btns = `<button ${page<=1?'disabled':''} onclick="page--;render()">‹</button>`;
  for(let p=Math.max(1,page-2);p<=Math.min(tp,page+2);p++) btns+=`<button class="${p===page?'active':''}" onclick="page=${p};render()">${p}</button>`;
  btns += `<button ${page>=tp?'disabled':''} onclick="page++;render()">›</button>`;
  return `<div class="pagination"><span class="pagination-info">${s}–${e} / ${filtered.length}</span><div class="pg-btns">${btns}</div></div>`;
}

/* ══════════════════════════════════════
   DETAIL PANEL
   ══════════════════════════════════════ */
function openDetail(idx) {
  selectedTask = ALL[idx];
  const t = selectedTask;
  const panel = document.getElementById('detailPanel');
  panel.classList.add('open');

  let clHTML = '';
  if (t._checklist && Array.isArray(t._checklist) && t._checklist.length > 0) {
    const items = t._checklist;
    const doneCount = items.filter(i=>i.isChecked).length;
    const pct = items.length ? Math.round(doneCount/items.length*100) : 0;
    clHTML += `<div class="checklist-progress"><div class="cl-bar-track"><div class="cl-bar-fill" style="width:${pct}%"></div></div><div class="cl-bar-label">${doneCount}/${items.length}</div></div>`;
    clHTML += '<ul class="checklist">';
    items.forEach((item, i) => {
      clHTML += `<li class="checklist-item ${item.isChecked?'done':''}"><input type="checkbox" ${item.isChecked?'checked':''} onchange="toggleChecklist(${idx},${i},this.checked)"> <span>${item.title}</span></li>`;
    });
    clHTML += '</ul>';
  } else if (t.ChecklistTotal > 0) {
    const pct = t.ChecklistTotal ? Math.round(t.ChecklistDone/t.ChecklistTotal*100) : 0;
    clHTML += `<div class="checklist-progress"><div class="cl-bar-track"><div class="cl-bar-fill" style="width:${pct}%"></div></div><div class="cl-bar-label">${t.ChecklistDone}/${t.ChecklistTotal}</div></div>`;
    clHTML += `<p style="font-size:0.78rem;color:var(--text-3);font-style:italic">Chi tiết checklist chưa có.</p>`;
  }

  document.getElementById('detailContent').innerHTML = `
    <div class="detail-header">
      <button class="detail-close" onclick="closeDetail()">✕</button>
      <div class="detail-title">${t.Title}</div>
      <div class="detail-meta">
        <span class="status-pill ${statusClass(t.Status)}">${statusLabel(t.Status)}</span>
        <span class="priority-tag ${prClass(t.Priority)}">${prLabel(t.Priority)}</span>
        ${labelHTML(t.Labels)}
      </div>
    </div>

    <div class="detail-field">
      <div class="detail-field-label">Phụ trách</div>
      <div class="detail-field-value">${t.AssignedTo || '(Chưa gán)'}</div>
    </div>

    <div class="detail-field">
      <div class="detail-field-label">Deadline</div>
      <div class="detail-field-value">
        <span class="due-cell ${dueCat(t.DueDate,t.Status)==='overdue'?'due-overdue':''}">${t.DueDate ? new Date(t.DueDate).toLocaleDateString('vi-VN',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'}) : 'Chưa set'}</span>
        ${t.DueDate && t.Status!=='Completed' ? `<span style="font-family:var(--mono);font-size:0.72rem;margin-left:8px;color:${dueCat(t.DueDate,t.Status)==='overdue'?'var(--red)':'var(--text-2)'}">(${daysLeft(t.DueDate)})</span>` : ''}
      </div>
    </div>

    <div class="detail-field">
      <div class="detail-field-label">Bucket</div>
      <div class="detail-field-value" style="font-size:0.78rem;color:var(--text-2)">${t.BucketName || '—'}</div>
    </div>

    <div class="detail-field">
      <div class="detail-field-label">Mô tả</div>
      <div class="desc-box ${t.Description?'':'empty'}">${t.Description || 'Chưa có mô tả'}</div>
    </div>

    <div class="detail-field">
      <div class="detail-field-label">Checklist</div>
      ${clHTML || '<p style="font-size:0.78rem;color:var(--text-3)">Không có checklist</p>'}
    </div>

    <div class="detail-field">
      <div class="detail-field-label">Lịch sử thay đổi</div>
      ${renderTaskHistory(t)}
    </div>

    <div class="detail-field" style="margin-top:20px;padding-top:16px;border-top:1px solid var(--border-0)">
      <div style="display:flex;gap:12px;font-size:0.68rem;color:var(--text-3);font-family:var(--mono)">
        <span>Tạo: ${fmtDate(t.CreatedDate)}</span>
        ${t.CompletedDate ? `<span>Xong: ${fmtDate(t.CompletedDate)}</span>` : ''}
        <span>%: ${t.PercentComplete||0}</span>
      </div>
    </div>
  `;
  render(); // re-render to highlight selected row
}

function closeDetail() {
  selectedTask = null;
  document.getElementById('detailPanel').classList.remove('open');
  render();
}

function toggleChecklist(taskIdx, itemIdx, checked) {
  const t = ALL[taskIdx];
  if (t._checklist && Array.isArray(t._checklist) && t._checklist[itemIdx]) {
    t._checklist[itemIdx].isChecked = checked;
    t.ChecklistDone = t._checklist.filter(i=>i.isChecked).length;
  }
  openDetail(taskIdx);
}

/* ══════════════════════════════════════
   ANALYTICS VIEW
   ══════════════════════════════════════ */
function renderAnalytics(container) {
  applyFilters();
  const todayD = today();
  const total=filtered.length, ip=filtered.filter(t=>t.Status==='In Progress').length;
  const done=filtered.filter(t=>t.Status==='Completed').length;
  const ns=filtered.filter(t=>t.Status==='Not Started').length;
  const overdue=filtered.filter(t=>t.Status!=='Completed'&&t.DueDate&&new Date(t.DueDate)<todayD).length;
  const rate=total?Math.round(done/total*100):0;

  let html = '<div class="fade-in">';

  // KPI
  html += `<div class="kpi-row">
    <div class="kpi-mini"><div class="kpi-mini-label">Tổng</div><div class="kpi-mini-val" style="color:var(--blue)">${total}</div></div>
    <div class="kpi-mini"><div class="kpi-mini-label">Đang thực hiện</div><div class="kpi-mini-val" style="color:var(--amber)">${ip}</div></div>
    <div class="kpi-mini"><div class="kpi-mini-label">Hoàn thành</div><div class="kpi-mini-val" style="color:var(--green)">${done}</div></div>
    <div class="kpi-mini"><div class="kpi-mini-label">Quá hạn</div><div class="kpi-mini-val" style="color:var(--red)">${overdue}</div></div>
    <div class="kpi-mini"><div class="kpi-mini-label">Tỷ lệ</div><div class="kpi-mini-val" style="color:var(--purple)">${rate}%</div></div>
  </div>`;

  // Donut + Bar
  const counts = {ns, ip, done};
  const colors = {ns:'#5c6b88', ip:'#528bff', done:'#34d399'};
  const labels = {ns:'Chưa bắt đầu', ip:'Đang thực hiện', done:'Hoàn thành'};
  const r=58,cx=75,cy=75,sw=18,circ=2*Math.PI*r;
  let off=0, paths='';
  Object.entries(counts).forEach(([k,v])=>{const dash=(v/(total||1))*circ;paths+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${colors[k]}" stroke-width="${sw}" stroke-dasharray="${dash} ${circ-dash}" stroke-dashoffset="${-off}" transform="rotate(-90 ${cx} ${cy})" style="transition:stroke-dasharray .5s"/>`;off+=dash});
  let legend = Object.entries(counts).map(([k,v])=>`<div class="legend-row"><span class="legend-dot" style="background:${colors[k]}"></span>${labels[k]}<span class="legend-val">${v}</span></div>`).join('');

  html += '<div class="charts-row">';
  html += `<div class="chart-card"><div class="chart-title">Tiến độ tổng quan</div><div class="donut-wrap"><svg class="donut-svg" viewBox="0 0 150 150">${paths}<text x="${cx}" y="${cy-4}" text-anchor="middle" fill="var(--text-0)" font-family="var(--font)" font-size="20" font-weight="800">${rate}%</text><text x="${cx}" y="${cy+14}" text-anchor="middle" fill="var(--text-2)" font-family="var(--font)" font-size="9">hoàn thành</text></svg><div class="donut-legend">${legend}</div></div></div>`;

  // Bar chart by label
  const labelNames = Object.keys(CFG.LABELS);
  const barData = labelNames.map(l=>{
    const tasks=filtered.filter(t=>(t.Labels||'').includes(l));
    const ov=tasks.filter(t=>t.Status!=='Completed'&&t.DueDate&&new Date(t.DueDate)<todayD).length;
    const sn=tasks.filter(t=>{if(t.Status==='Completed'||!t.DueDate)return false;const d=Math.ceil((new Date(t.DueDate)-todayD)/86400000);return d>=0&&d<=7}).length;
    const ok=tasks.filter(t=>{if(!t.DueDate)return false;if(t.Status==='Completed')return true;return Math.ceil((new Date(t.DueDate)-todayD)/86400000)>7}).length;
    return{l,ov,sn,ok,total:tasks.length}
  }).filter(d=>d.total>0);
  const max=Math.max(...barData.map(d=>d.total),1);

  html += `<div class="chart-card"><div class="chart-title">Deadline theo nhãn</div><div class="bar-chart">`;
  barData.forEach(d=>{
    html+=`<div class="bar-row"><span class="bar-label">${d.l}</span><div class="bar-track">${d.ov?`<div class="bar-fill bf-red" style="width:${d.ov/max*100}%">${d.ov}</div>`:''}${d.sn?`<div class="bar-fill bf-amber" style="width:${d.sn/max*100}%">${d.sn}</div>`:''}${d.ok?`<div class="bar-fill bf-green" style="width:${d.ok/max*100}%">${d.ok}</div>`:''}</div></div>`;
  });
  html += `<div class="bar-legend"><span><span class="ldot" style="background:var(--red)"></span> Quá hạn</span><span><span class="ldot" style="background:var(--amber)"></span> ≤7 ngày</span><span><span class="ldot" style="background:var(--green)"></span> Ổn/Xong</span></div>`;
  html += '</div></div></div>';

  html += '</div>';
  container.innerHTML = html;
}

/* ══════════════════════════════════════
   CALENDAR VIEW
   ══════════════════════════════════════ */
function renderCalendar(container) {
  const now = new Date();
  const year = now.getFullYear(), month = now.getMonth();
  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month+1, 0);
  const startOffset = (firstDay.getDay() + 6) % 7; // Monday=0

  let html = '<div class="fade-in">';
  html += `<div style="font-size:0.92rem;font-weight:600;margin-bottom:12px">Tháng ${month+1}/${year}</div>`;
  html += '<div class="calendar-grid">';
  ['T2','T3','T4','T5','T6','T7','CN'].forEach(d => html += `<div class="cal-header">${d}</div>`);

  // Empty cells before month start
  for (let i=0; i<startOffset; i++) html += '<div class="cal-cell" style="opacity:0.3"></div>';

  const todayD = today();
  for (let d=1; d<=lastDay.getDate(); d++) {
    const cellDate = new Date(year, month, d);
    const dateStr = cellDate.toISOString().split('T')[0];
    const isToday = cellDate.getTime() === todayD.getTime();
    const dayTasks = ALL.filter(t => t.DueDate && t.DueDate.startsWith(dateStr));

    html += `<div class="cal-cell ${isToday?'today':''}"><div class="cal-day">${d}</div>`;
    dayTasks.slice(0,3).forEach(t => {
      const cls = t.Status==='Completed'?'done':dueCat(t.DueDate,t.Status)==='overdue'?'overdue':'inprog';
      html += `<div class="cal-task ${cls}" onclick="openDetail(${ALL.indexOf(t)})" title="${t.Title}">${t.Title}</div>`;
    });
    if (dayTasks.length > 3) html += `<div style="font-size:0.6rem;color:var(--text-3)">+${dayTasks.length-3} more</div>`;
    html += '</div>';
  }

  html += '</div></div>';
  container.innerHTML = html;
}

   SETTINGS — Theme + Font Size
   ══════════════════════════════════════ */
function openSettings() { document.getElementById('settingsOverlay').classList.add('open'); }
function closeSettings() { document.getElementById('settingsOverlay').classList.remove('open'); }

function initSettings() {
  const saved = localStorage.getItem('hr_theme') || 'dark';
  const savedFont = localStorage.getItem('hr_font') || 'md';
  applyTheme(saved); applyFont(savedFont);

  document.querySelectorAll('[data-theme]').forEach(el => {
    el.onclick = () => applyTheme(el.dataset.theme);
  });
  document.querySelectorAll('[data-font]').forEach(el => {
    el.onclick = () => applyFont(el.dataset.font);
  });
}

function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('hr_theme', t);
  document.querySelectorAll('#themeOptions .settings-opt').forEach(el => el.classList.toggle('active', el.dataset.theme === t));
}

function applyFont(f) {
  document.documentElement.setAttribute('data-font', f);
  localStorage.setItem('hr_font', f);
  document.querySelectorAll('#fontOptions .settings-opt').forEach(el => el.classList.toggle('active', el.dataset.font === f));
}

function renderTaskHistory(t) {
  const hasRealHistory = Array.isArray(t._history);
  const history = hasRealHistory ? t._history : getMockHistory(t.Title);
  const sourceLabel = hasRealHistory
    ? `<span style="font-size:0.62rem;color:var(--green);font-family:var(--mono);margin-left:6px">● LIVE</span>`
    : (CFG.HISTORY_URL
        ? `<span style="font-size:0.62rem;color:var(--text-3);font-family:var(--mono);margin-left:6px">○ NO MATCH</span>`
        : `<span style="font-size:0.62rem;color:var(--amber);font-family:var(--mono);margin-left:6px">◐ MOCK</span>`);

  if (!history.length) return `<div style="display:flex;align-items:center"><span style="font-size:0.82rem;color:var(--text-3);font-style:italic">Chưa có lịch sử thay đổi</span>${sourceLabel}</div>`;

  const fieldLabels = { deadline: 'Deadline', status: 'Status', priority: 'Priority', assignee: 'Assignee' };
  let dlCount = 0, stCount = 0, prCount = 0, asCount = 0;

  let html = `<div style="display:flex;align-items:center;margin-bottom:6px"><span style="font-size:0.72rem;color:var(--text-2)">${history.length} thay đổi</span>${sourceLabel}</div>`;
  html += '<div class="timeline">';
  const sorted = [...history].sort((a, b) => new Date(b.date) - new Date(a.date));
  sorted.forEach(h => {
    if (h.field === 'deadline') dlCount++;
    if (h.field === 'status') stCount++;
    if (h.field === 'priority') prCount++;
    if (h.field === 'assignee') asCount++;
    const d = new Date(h.date);
    const dateStr = d.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' }) + ' ' + d.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
    html += `<div class="tl-item">
      <div class="tl-dot ${h.field}"></div>
      <div class="tl-date">${dateStr}</div>
      <div class="tl-change">
        <span class="tl-badge ${h.field}">${fieldLabels[h.field] || h.field}</span>
        <span class="tl-old">${h.old || '(trống)'}</span>
        <span class="tl-arrow">→</span>
        <span class="tl-new">${h.new || '(trống)'}</span>
      </div>
    </div>`;
  });

  html += `<div class="tl-item"><div class="tl-dot created"></div><div class="tl-date">${fmtDate(t.CreatedDate)}</div><div class="tl-change"><span class="tl-badge" style="background:var(--green-d);color:var(--green)">Created</span> Task được tạo</div></div>`;
  html += '</div>';

  const parts = [];
  if (dlCount) parts.push(`<span style="color:var(--red)">${dlCount}x đổi deadline</span>`);
  if (stCount) parts.push(`<span style="color:var(--blue)">${stCount}x đổi status</span>`);
  if (prCount) parts.push(`<span style="color:var(--amber)">${prCount}x đổi priority</span>`);
  if (asCount) parts.push(`<span style="color:var(--purple)">${asCount}x đổi assignee</span>`);
  if (parts.length) html += `<div class="tl-summary">${parts.join('')}</div>`;

  return html;
}

/* ══════════════════════════════════════
   PERFORMANCE REPORT VIEW
   ══════════════════════════════════════ */
let perfUser = '', perfFrom = '', perfTo = '';

function renderPerformance(container) {
  if (!perfUser) perfUser = currentUser === 'all' ? CFG.MEMBERS[1].id : currentUser;
  if (!perfFrom) { const d = new Date(); d.setDate(1); perfFrom = d.toISOString().split('T')[0]; }
  if (!perfTo) perfTo = new Date().toISOString().split('T')[0];

  const m = CFG.MEMBERS.find(x => x.id === perfUser) || CFG.MEMBERS[1];
  const tasks = ALL.filter(t => (t.AssignedTo || '').includes(perfUser));
  const inRange = tasks.filter(t => {
    const created = t.CreatedDate || '';
    return created >= perfFrom && created <= perfTo;
  });

  const todayD = today();
  const total = inRange.length;
  const done = inRange.filter(t => t.Status === 'Completed').length;
  const ip = inRange.filter(t => t.Status === 'In Progress').length;
  const overdue = inRange.filter(t => t.Status !== 'Completed' && t.DueDate && new Date(t.DueDate) < todayD).length;

  const onTime = inRange.filter(t => {
    if (t.Status !== 'Completed' || !t.DueDate) return false;
    const comp = t.CompletedDate ? new Date(t.CompletedDate) : todayD;
    return comp <= new Date(t.DueDate);
  }).length;
  const late = done - onTime;
  const onTimePct = done ? Math.round(onTime / done * 100) : 0;

  let totalDlChanges = 0;
  let historySource = 'none'; // Track whether perf report uses real or mock history
  inRange.forEach(t => {
    const hasReal = Array.isArray(t._history);
    if (hasReal) historySource = 'live';
    else if (historySource !== 'live') historySource = CFG.HISTORY_URL ? 'nomatch' : 'mock';
    const hist = hasReal ? t._history : getMockHistory(t.Title);
    totalDlChanges += hist.filter(h => h.field === 'deadline').length;
  });

  const avgDays = done > 0 ? (inRange.filter(t => t.Status === 'Completed' && t.CreatedDate).reduce((sum, t) => {
    const created = new Date(t.CreatedDate);
    const completed = new Date(t.CompletedDate || todayD);
    return sum + Math.ceil((completed - created) / 86400000);
  }, 0) / done).toFixed(1) : '—';

  const totalCl = inRange.reduce((s, t) => s + (t.ChecklistTotal || 0), 0);
  const doneCl = inRange.reduce((s, t) => s + (t.ChecklistDone || 0), 0);
  const clRate = totalCl ? Math.round(doneCl / totalCl * 100) : 0;

  // Score calculation
  const completionScore = total ? Math.round((done / total) * 30) : 0;
  const onTimeScore = done ? Math.round((onTimePct / 100) * 25) : 0;
  const dlScore = Math.max(0, 20 - totalDlChanges * 4);
  const clScore = Math.round((clRate / 100) * 15);
  const speedScore = avgDays !== '—' && parseFloat(avgDays) <= 10 ? 10 : avgDays !== '—' ? Math.max(0, Math.round(10 - (parseFloat(avgDays) - 10) * 0.5)) : 5;
  const totalScore = Math.min(100, completionScore + onTimeScore + dlScore + clScore + speedScore);
  const grade = totalScore >= 90 ? 'A+' : totalScore >= 80 ? 'A' : totalScore >= 75 ? 'B+' : totalScore >= 65 ? 'B' : totalScore >= 50 ? 'C' : 'D';
  const gradeColor = totalScore >= 75 ? 'var(--green)' : totalScore >= 50 ? 'var(--amber)' : 'var(--red)';

  let html = '<div class="fade-in">';

  // Header
  html += `<div class="perf-header">
    <div class="perf-avatar" style="background:${m.color.replace(')', ',0.15)').replace('var(', 'rgba(')};color:${m.color}">${m.initials}</div>
    <div><div class="perf-name">${m.name}</div><div class="perf-role">HR Team · SOL E&C</div></div>
    <div class="perf-date-range">
      <select style="font-size:0.82rem;background:var(--bg-2);border:1px solid var(--border-0);border-radius:var(--r-sm);padding:6px 10px;color:var(--text-0)" onchange="perfUser=this.value;renderPerformance(document.getElementById('contentMain'))">
        ${CFG.MEMBERS.slice(1).map(x => `<option value="${x.id}" ${x.id === perfUser ? 'selected' : ''}>${x.name}</option>`).join('')}
      </select>
      <input type="date" value="${perfFrom}" onchange="perfFrom=this.value;renderPerformance(document.getElementById('contentMain'))">
      <span style="color:var(--text-3);font-size:0.78rem">đến</span>
      <input type="date" value="${perfTo}" onchange="perfTo=this.value;renderPerformance(document.getElementById('contentMain'))">
    </div>
  </div>`;

  // KPI cards
  html += `<div class="perf-kpi">
    <div class="perf-card"><div class="perf-card-label">Tổng task</div><div class="perf-card-val" style="color:var(--blue)">${total}</div></div>
    <div class="perf-card"><div class="perf-card-label">Hoàn thành</div><div class="perf-card-val" style="color:var(--green)">${done}</div><div class="perf-card-sub" style="color:var(--green)">${total ? Math.round(done / total * 100) : 0}%</div></div>
    <div class="perf-card"><div class="perf-card-label">Đúng hạn</div><div class="perf-card-val" style="color:var(--green)">${onTime}</div><div class="perf-card-sub" style="color:var(--green)">${onTimePct}% on-time</div></div>
    <div class="perf-card"><div class="perf-card-label">Trễ hạn</div><div class="perf-card-val" style="color:var(--red)">${late + overdue}</div></div>
  </div>`;

  // Detail cards
  const histBadge = historySource === 'live'
    ? '<span style="font-size:0.58rem;color:var(--green);font-family:var(--mono);margin-left:6px">● LIVE</span>'
    : historySource === 'mock'
    ? '<span style="font-size:0.58rem;color:var(--amber);font-family:var(--mono);margin-left:6px">◐ MOCK</span>'
    : '';
  html += `<div class="perf-detail-grid">
    <div class="perf-detail-card">
      <div class="perf-detail-title">Kỷ luật deadline ${histBadge}</div>
      <div class="perf-detail-row"><span>Số lần dời deadline</span><span style="color:${totalDlChanges > 0 ? 'var(--red)' : 'var(--green)'}">${totalDlChanges} lần</span></div>
      <div class="perf-detail-row"><span>TB thời gian hoàn thành</span><span>${avgDays} ngày</span></div>
      <div class="perf-detail-row"><span>Task quá hạn hiện tại</span><span style="color:${overdue > 0 ? 'var(--red)' : 'var(--green)'}">${overdue} task</span></div>
    </div>
    <div class="perf-detail-card">
      <div class="perf-detail-title">Hiệu suất xử lý</div>
      <div class="perf-detail-row"><span>Checklist completion</span><span style="color:${clRate >= 70 ? 'var(--green)' : 'var(--amber)'}">${clRate}%</span></div>
      <div class="perf-detail-row"><span>Task đang thực hiện</span><span>${ip}</span></div>
      <div class="perf-detail-row"><span>Task Urgent/Important</span><span>${inRange.filter(t => t.Priority === 'Urgent' || t.Priority === 'Important').length}</span></div>
    </div>
  </div>`;

  // Score section
  html += `<div class="score-section">
    <div class="perf-detail-title">Điểm đánh giá tổng hợp</div>
    <div class="score-header">
      <div class="score-grade" style="color:${gradeColor}">${grade}</div>
      <div style="flex:1"><div style="font-size:0.85rem;color:var(--text-2);margin-bottom:8px">Điểm số: ${totalScore}/100</div>
        <div style="height:8px;background:var(--bg-3);border-radius:4px;overflow:hidden"><div style="height:100%;width:${totalScore}%;background:${gradeColor};border-radius:4px"></div></div>
      </div>
    </div>
    <div class="score-bar-wrap">
      <div class="score-bar-row"><span class="score-bar-label">Tỷ lệ hoàn thành (30%)</span><div class="score-bar-track"><div class="score-bar-fill" style="width:${(completionScore/30)*100}%;background:var(--blue)"></div></div><span class="score-bar-num">${completionScore}/30</span></div>
      <div class="score-bar-row"><span class="score-bar-label">Đúng deadline (25%)</span><div class="score-bar-track"><div class="score-bar-fill" style="width:${(onTimeScore/25)*100}%;background:var(--green)"></div></div><span class="score-bar-num">${onTimeScore}/25</span></div>
      <div class="score-bar-row"><span class="score-bar-label">Kỷ luật deadline (20%)</span><div class="score-bar-track"><div class="score-bar-fill" style="width:${(dlScore/20)*100}%;background:var(--amber)"></div></div><span class="score-bar-num">${dlScore}/20</span></div>
      <div class="score-bar-row"><span class="score-bar-label">Checklist detail (15%)</span><div class="score-bar-track"><div class="score-bar-fill" style="width:${(clScore/15)*100}%;background:var(--cyan)"></div></div><span class="score-bar-num">${clScore}/15</span></div>
      <div class="score-bar-row"><span class="score-bar-label">Tốc độ xử lý (10%)</span><div class="score-bar-track"><div class="score-bar-fill" style="width:${(speedScore/10)*100}%;background:var(--purple)"></div></div><span class="score-bar-num">${speedScore}/10</span></div>
    </div>
    <div style="margin-top:10px;font-size:0.72rem;color:var(--text-3)">A+ (90-100) · A (80-89) · B+ (75-79) · B (65-74) · C (50-64) · D (&lt;50)</div>
  </div>`;

  // Task detail table
  html += `<div style="background:var(--bg-2);border:1px solid var(--border-0);border-radius:var(--r-lg);padding:16px 20px">
    <div class="perf-detail-title">Chi tiết task trong kỳ</div>
    <div style="overflow-x:auto"><table class="perf-table"><thead><tr>
      <th>Task</th><th>Trạng thái</th><th>Deadline</th><th>Hoàn thành</th><th>Đổi DL</th><th>CL</th>
    </tr></thead><tbody>`;

  inRange.forEach(t => {
    const hist = t._history || getMockHistory(t.Title);
    const dlChanges = hist.filter(h => h.field === 'deadline').length;
    const isLate = t.Status === 'Completed' && t.CompletedDate && t.DueDate && new Date(t.CompletedDate) > new Date(t.DueDate);
    html += `<tr>
      <td style="font-weight:500">${t.Title}</td>
      <td><span class="status-pill ${statusClass(t.Status)}" style="font-size:0.72rem">${statusLabel(t.Status)}</span></td>
      <td style="font-family:var(--mono);font-size:0.78rem">${fmtDate(t.DueDate)}</td>
      <td style="font-family:var(--mono);font-size:0.78rem;color:${isLate ? 'var(--red)' : t.CompletedDate ? 'var(--green)' : 'var(--text-3)'}">${fmtDate(t.CompletedDate) || '—'}</td>
      <td style="font-family:var(--mono);font-size:0.78rem;color:${dlChanges > 0 ? 'var(--red)' : 'var(--text-3)'}">${dlChanges > 0 ? dlChanges + 'x' : '0'}</td>
      <td style="font-family:var(--mono);font-size:0.78rem">${t.ChecklistTotal > 0 ? t.ChecklistDone + '/' + t.ChecklistTotal : '—'}</td>
    </tr>`;
  });

  html += '</tbody></table></div></div>';
  html += '</div>';
  container.innerHTML = html;
}

/* ══════════════════════════════════════
   INIT
   ══════════════════════════════════════ */
(async function() {
  initSettings();
  await loadData();
  buildSidebar();
  render();
})();
</script>
</body>
</html>
